name: Claude Assistant

on:
  issues:
    types: [labeled]

jobs:
  claude-implement:
    # Only runs if 'claude' label added AND issue was created by you
    if: |
      github.event.label.name == 'claude' && 
      github.event.issue.user.login == 'adelin-diac'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Implement the feature/fix described in issue #${{ github.event.issue.number }}.

            1. Read the issue carefully
            2. Implement the solution
            3. Add/update tests if applicable
            4. Create a PR referencing this issue
