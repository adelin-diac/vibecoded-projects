name: Claude Assistant

on:
  issues:
    types: [labeled]

jobs:
  claude-implement:
    if: |
      github.event.label.name == 'claude' && 
      github.event.issue.user.login == 'adelin-diac'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Create working branch
        run: |
          git checkout -b claude/issue-${{ github.event.issue.number }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash(gh:*)" "Bash(git:*)" "Bash(npm:*)" "Bash(node:*)" "Read" "Write" "Edit" "Glob" "Grep"
          prompt: |
            Implement the feature/fix described in issue #${{ github.event.issue.number }}.

            1. Use `gh issue view ${{ github.event.issue.number }}` to read the issue
            2. Implement the solution
            3. Add/update tests if applicable
            4. Commit your changes with `git add . && git commit -m "your message"`
            5. Create a PR with `gh pr create --title "Fix #${{ github.event.issue.number }}" --body "Closes #${{ github.event.issue.number }}"`
