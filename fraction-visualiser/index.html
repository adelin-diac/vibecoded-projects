<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Circle Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-section {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .fraction-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        
        .fraction-input label {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        
        .fraction-input input {
            width: 60px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }
        
        .fraction-input input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .slash {
            font-size: 24px;
            color: #333;
            margin: 5px 0;
        }
        
        .visualization {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        
        .circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        canvas {
            border: 3px solid #eee;
            border-radius: 10px;
            background: white;
        }
        
        .fraction-label {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        .percentage {
            font-size: 14px;
            color: #666;
        }
        
        .equal-message {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .equal {
            background-color: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .not-equal {
            background-color: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            border: 2px solid #f5c6cb;
        }
        
        .toggle-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .toggle-button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .toggle-button:hover {
            background-color: #764ba2;
        }
        
        .toggle-button.active {
            background-color: #28a745;
        }
        
        .overlap-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            display: none;
        }
        
        .overlap-container.show {
            display: block;
        }
        
        .overlap-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .overlap-label {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥧 Fraction Circle Visualizer</h1>
        <p class="subtitle">Compare two fractions visually</p>
        
        <div class="input-section">
            <div class="fraction-input">
                <label for="numerator1">Fraction 1</label>
                <input type="number" id="numerator1" placeholder="Numerator" value="1" min="0">
                <div class="slash">/</div>
                <input type="number" id="denominator1" placeholder="Denominator" value="2" min="1">
            </div>
            
            <div class="fraction-input">
                <label for="numerator2">Fraction 2</label>
                <input type="number" id="numerator2" placeholder="Numerator" value="2" min="0">
                <div class="slash">/</div>
                <input type="number" id="denominator2" placeholder="Denominator" value="4" min="1">
            </div>
        </div>
        
        <div class="toggle-section">
            <button class="toggle-button" id="toggleButton">Overlap Circles</button>
        </div>
        
        <div class="visualization">
            <div class="circle-container">
                <canvas id="canvas1" width="250" height="250"></canvas>
                <div class="fraction-label" id="label1">1/2</div>
                <div class="percentage" id="percent1">50%</div>
            </div>
            
            <div class="circle-container">
                <canvas id="canvas2" width="250" height="250"></canvas>
                <div class="fraction-label" id="label2">2/4</div>
                <div class="percentage" id="percent2">50%</div>
            </div>
        </div>
        
        <div class="overlap-container" id="overlapContainer">
            <canvas id="overlapCanvas" width="300" height="300"></canvas>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background-color: rgba(102, 126, 234, 0.6);"></div>
                    <span>Fraction 1</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: rgba(118, 75, 162, 0.6);"></div>
                    <span>Fraction 2</span>
                </div>
            </div>
            <div class="overlap-label">Overlapped view - darker area shows both fractions</div>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        const inputs = {
            num1: document.getElementById('numerator1'),
            den1: document.getElementById('denominator1'),
            num2: document.getElementById('numerator2'),
            den2: document.getElementById('denominator2')
        };

        const canvases = {
            canvas1: document.getElementById('canvas1'),
            canvas2: document.getElementById('canvas2')
        };

        const labels = {
            label1: document.getElementById('label1'),
            label2: document.getElementById('label2'),
            percent1: document.getElementById('percent1'),
            percent2: document.getElementById('percent2')
        };
        
        const overlapCanvas = document.getElementById('overlapCanvas');
        const overlapContainer = document.getElementById('overlapContainer');
        const toggleButton = document.getElementById('toggleButton');
        let isOverlapMode = false;
        
        toggleButton.addEventListener('click', function() {
            isOverlapMode = !isOverlapMode;
            toggleButton.classList.toggle('active');
            canvases.canvas1.parentElement.style.display = isOverlapMode ? 'none' : 'flex';
            canvases.canvas2.parentElement.style.display = isOverlapMode ? 'none' : 'flex';
            overlapContainer.classList.toggle('show');
            updateVisualization();
        });

        function drawCircle(canvas, numerator, denominator, color = '#667eea') {
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 100;

            // Clear canvas
            ctx.fillStyle = '#f9f9f9';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Validate inputs
            if (numerator < 0 || denominator <= 0) {
                ctx.fillStyle = '#ccc';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // Cap numerator at denominator for visualization
            const displayNumerator = Math.min(numerator, denominator);
            const sliceAngle = (2 * Math.PI * displayNumerator) / denominator;

            // Draw full circle outline
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.stroke();

            // Draw filled slice
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + sliceAngle);
            ctx.closePath();
            ctx.fill();

            // Draw border on slice
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + sliceAngle);
            ctx.closePath();
            ctx.stroke();
        }
        
        function drawOverlapCircles(canvas, num1, den1, num2, den2) {
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 100;

            // Clear canvas
            ctx.fillStyle = '#f9f9f9';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Validate inputs
            if (num1 < 0 || den1 <= 0 || num2 < 0 || den2 <= 0) {
                return;
            }

            // Calculate slice angles
            const displayNum1 = Math.min(num1, den1);
            const displayNum2 = Math.min(num2, den2);
            const sliceAngle1 = (2 * Math.PI * displayNum1) / den1;
            const sliceAngle2 = (2 * Math.PI * displayNum2) / den2;

            // Draw circle outline
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.stroke();

            // Draw fraction 2 slice (lighter color, drawn first)
            ctx.fillStyle = 'rgba(118, 75, 162, 0.4)';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + sliceAngle2);
            ctx.closePath();
            ctx.fill();

            // Draw fraction 1 slice (darker color, drawn on top)
            ctx.fillStyle = 'rgba(102, 126, 234, 0.6)';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + sliceAngle1);
            ctx.closePath();
            ctx.fill();

            // Draw border
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.stroke();
        }

        function updateVisualization() {
            const num1 = parseInt(inputs.num1.value) || 0;
            const den1 = parseInt(inputs.den1.value) || 1;
            const num2 = parseInt(inputs.num2.value) || 0;
            const den2 = parseInt(inputs.den2.value) || 1;

            // Check for errors
            let errorMsg = '';
            if (den1 <= 0 || den2 <= 0) {
                errorMsg = 'Denominator must be greater than 0';
            }
            if (num1 < 0 || num2 < 0) {
                errorMsg = 'Numerator must be 0 or greater';
            }

            const messageDiv = document.getElementById('message');
            if (errorMsg) {
                messageDiv.innerHTML = `<div class="error">${errorMsg}</div>`;
                return;
            }

            // Draw circles or overlap
            if (isOverlapMode) {
                drawOverlapCircles(overlapCanvas, num1, den1, num2, den2);
            } else {
                drawCircle(canvases.canvas1, num1, den1, '#667eea');
                drawCircle(canvases.canvas2, num2, den2, '#764ba2');
            }

            // Update labels
            labels.label1.textContent = `${num1}/${den1}`;
            labels.label2.textContent = `${num2}/${den2}`;

            // Calculate percentages
            const percent1 = ((num1 / den1) * 100).toFixed(1);
            const percent2 = ((num2 / den2) * 100).toFixed(1);
            labels.percent1.textContent = `${percent1}%`;
            labels.percent2.textContent = `${percent2}%`;

            // Compare fractions
            const value1 = num1 / den1;
            const value2 = num2 / den2;

            if (Math.abs(value1 - value2) < 0.0001) {
                messageDiv.innerHTML = `<div class="equal-message equal">✓ These fractions are equal!</div>`;
            } else if (value1 > value2) {
                messageDiv.innerHTML = `<div class="equal-message not-equal">The first fraction is larger</div>`;
            } else {
                messageDiv.innerHTML = `<div class="equal-message not-equal">The second fraction is larger</div>`;
            }
        }

        // Event listeners
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', updateVisualization);
            input.addEventListener('change', updateVisualization);
        });

        // Initial draw
        updateVisualization();
    </script>
</body>
</html>
